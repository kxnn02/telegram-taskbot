name: CI

# ADR-0005: typecheck + the fast in-memory-fake suite run on every push/PR;
# the contract-test suite against the real Supabase project (needs live
# network access and credentials) runs additionally on every push to main
# only.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    name: Typecheck + fast suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Catches webpack-bundling issues tsc alone can't see (e.g. the
      # NodeNext ".js"-extension imports in src/ not resolving through
      # webpack without next.config.ts's extensionAlias) — no live
      # Supabase credentials are needed since the dashboard's dynamic
      # routes aren't executed at build time, only type-checked/bundled.
      - run: npm run build:next

  contract:
    name: Supabase contract tests (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"
      - run: npm ci
      - run: npm run sweep:test-cohorts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run test:live
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
